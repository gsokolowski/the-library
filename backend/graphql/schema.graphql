"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    """
    All books (ordered by title). Cached for 60 seconds when `CACHE_STORE=redis` (see `BookQuery`).
    """
    books: [Book!]! @field(resolver: "BookQuery@all")

    "Single book by primary key."
    book(id: ID! @eq): Book @find(model: "Book")

    "Library users (name, surname, email) who can borrow books — distinct from app login accounts."
    libraryUsers: [LibraryUser!]! @all(model: "LibraryUser")

    libraryUser(id: ID! @eq): LibraryUser @find(model: "LibraryUser")

    """
    Recent desk activity (borrow / return), newest first. Fed by RabbitMQ when enabled, otherwise written synchronously from BookObserver.
    """
    circulationEvents(limit: Int = 30): [CirculationEvent!]!
        @field(resolver: "App\\GraphQL\\Queries\\CirculationEventsQuery")
}

type LibraryUser {
    id: ID!
    name: String!
    surname: String!
    email: String!
    created_at: DateTime!
    updated_at: DateTime!
    books: [Book!]! @hasMany(relation: "books")
    waitlist: [BookWaitlistEntry!]! @field(resolver: "App\\GraphQL\\Queries\\LibraryUserFields@waitlist")
    notifications(unreadOnly: Boolean = false): [LibraryUserNotification!]!
        @field(resolver: "App\\GraphQL\\Queries\\LibraryUserFields@notifications")
}

type Book {
    id: ID!
    title: String!
    author: String!
    library_user_id: ID
    libraryUser: LibraryUser @belongsTo(relation: "libraryUser")
    created_at: DateTime!
    updated_at: DateTime!
    waitlistCount: Int! @field(resolver: "App\\GraphQL\\Queries\\BookWaitlistFields@waitlistCount")
    onWaitlist(libraryUserId: ID!): Boolean! @field(resolver: "App\\GraphQL\\Queries\\BookWaitlistFields@onWaitlist")
}

type BookWaitlistEntry @model(class: "BookWaitlist") {
    id: ID!
    book: Book! @belongsTo(relation: "book")
    libraryUser: LibraryUser! @belongsTo(relation: "libraryUser")
    status: String!
    created_at: DateTime!
    notified_at: DateTime
    fulfilled_at: DateTime
}

type LibraryUserNotification @model(class: "LibraryUserNotification") {
    id: ID!
    type: String!
    book: Book @belongsTo(relation: "book")
    title: String!
    body: String!
    read_at: DateTime
    created_at: DateTime!
}

type CirculationEvent @model(class: "CirculationEvent") {
    id: ID!
    kind: String!
    occurred_at: DateTime!
    book_id: ID
    book_title: String!
    library_user_id: ID
    patron_name: String
    summary: String! @field(resolver: "App\\GraphQL\\Queries\\CirculationEventFields@summary")
    created_at: DateTime!
}

type Mutation {
    """
    Create a book.
    When `RABBITMQ_ENABLED=true`, publishes a persistent JSON message: routing key `book.created`.
    """
    createBook(
        title: String! @rules(apply: ["required", "string", "max:255"])
        author: String! @rules(apply: ["required", "string", "max:255"])
    ): Book @create(model: "Book")

    """
    Update a book.
    When RabbitMQ is enabled, publishes `book.updated`.
    """
    updateBook(
        id: ID! @rules(apply: ["required", "integer", "exists:books,id"])
        title: String @rules(apply: ["sometimes", "string", "max:255"])
        author: String @rules(apply: ["sometimes", "string", "max:255"])
    ): Book @update(model: "Book")

    """
    Delete a book.
    When RabbitMQ is enabled, publishes `book.deleted`.
    """
    deleteBook(id: ID! @whereKey @rules(apply: ["required", "integer", "exists:books,id"])): Book @delete(model: "Book")

    """
    Create a library user (borrower). Not the same as the Laravel `users` auth table.
    """
    createLibraryUser(
        name: String! @rules(apply: ["required", "string", "max:255"])
        surname: String! @rules(apply: ["required", "string", "max:255"])
        email: String! @rules(apply: ["required", "email", "max:255", "unique:library_users,email"])
    ): LibraryUser @create(model: "LibraryUser")

    updateLibraryUser(
        id: ID!
        name: String
        surname: String
        email: String
    ): LibraryUser @update(model: "LibraryUser") @validator(class: "UpdateLibraryUserValidator")

    deleteLibraryUser(id: ID! @whereKey @rules(apply: ["required", "integer", "exists:library_users,id"])): LibraryUser
        @delete(model: "LibraryUser")

    """
    Set who is borrowing a book. Pass `libraryUserId: null` to mark the book as returned. If the argument is omitted, the borrower is left unchanged.

    When RabbitMQ is enabled: assigning or changing library user publishes routing key `book.borrowed`; clearing borrower publishes `book.returned`.
    Those events also feed the desk activity timeline (`circulationEvents`) via the circulation consumer (or synchronously when RabbitMQ is off).
    (`book.updated` is also emitted when anything on the row changes.)
    """
    setBookLibraryUser(
        id: ID! @rules(apply: ["required", "integer", "exists:books,id"])
        libraryUserId: ID @rules(apply: ["nullable", "integer", "exists:library_users,id"])
    ): Book @field(resolver: "SetBookLibraryUser")

    """
    Join the waitlist for a book that is currently checked out.
    """
    joinBookWaitlist(
        bookId: ID! @rules(apply: ["required", "integer", "exists:books,id"])
        libraryUserId: ID! @rules(apply: ["required", "integer", "exists:library_users,id"])
    ): BookWaitlistEntry! @field(resolver: "JoinBookWaitlist")

    """
    Leave the waitlist for a book.
    """
    leaveBookWaitlist(
        bookId: ID! @rules(apply: ["required", "integer", "exists:books,id"])
        libraryUserId: ID! @rules(apply: ["required", "integer", "exists:library_users,id"])
    ): Boolean! @field(resolver: "LeaveBookWaitlist")

    """
    Mark one or more library user notifications as read.
    """
    markNotificationsRead(ids: [ID!]!): [LibraryUserNotification!]! @field(resolver: "MarkNotificationsRead")
}
